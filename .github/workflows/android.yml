name: Android CI

on: [pull_request, push, workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install NDK 21.4.7075529
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk/21.4.7075529"
      - name: set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Build with Gradle
        run: cd VirtualApp && ./gradlew assembleRelease
      - name: ls
        run: ls
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled
          path: VirtualApp/app/build/
